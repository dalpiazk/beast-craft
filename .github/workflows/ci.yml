# ---------------------------------------------------------------------------
# The game runtime is engine-neutral C# (src/BeastCraft.Core, netstandard2.1)
# and its content lives under content/ (data JSON, pixel art). This job
# format-checks and compiles the runtime, the engine-neutral presentation layer
# (src/BeastCraft.Presentation), the shared MonoGame viewer (src/BeastCraft.Game)
# and the MonoGame DesktopGL host (src/BeastCraft.Desktop), then format-checks
# and runs the test suite
# (Tooling/EditModeTests, NUnit). No engine install is needed: MonoGame is a
# NuGet package, and the desktop host uses no content pipeline (MGCB) and no
# Windows-only dependencies, so it compiles on this Linux runner as is.
#
# CI-budget discipline applies: CI is a final gate, never a test loop --
# everything must be green locally first, one push per PR, and no per-commit
# fan-out. The Android host (src/BeastCraft.Android) is deliberately NOT built
# here: it needs the .NET Android workload, a JDK and the Android SDK on the
# runner, which would cost far more minutes than it is worth. It is a local
# build (README: "Running on Android"); everything it shares with desktop
# (BeastCraft.Game) is compiled and format-checked by the Desktop steps below.
# ---------------------------------------------------------------------------

name: CI

on:
  pull_request:
    branches: [main]
  # Deliberately NOT `push` on every branch: feature-branch commits are
  # validated when their PR opens/updates, not once per commit. This repo is
  # cost-conscious about Actions minutes.
  push:
    branches: [main]

# A superseded push to the same PR or branch cancels the run it replaced
# instead of burning minutes on a result nobody will read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Single job, no matrix.
  lint-and-compile:
    name: Lint and compile (C#)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Art/audio LFS objects are irrelevant to a C# compile; skipping the
          # smudge keeps checkout fast and off the LFS bandwidth quota.
          lfs: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          # NuGet caching is intentionally disabled. The packages are few and
          # small (System.Text.Json for the runtime; MonoGame DesktopGL and
          # FontStashSharp for the viewer and host; the test SDK and NUnit),
          # but no project commits a packages.lock.json, which setup-dotnet's
          # cache keys on by default, and `cache: true` once failed the job in
          # the post step ("Cache folder path is retrieved for .NET CLI but
          # doesn't exist on disk"). Re-enable it with a lock file (or an
          # explicit cache-dependency-path) if restores ever get slow.
          cache: false

      - name: Format check (dotnet format)
        run: >-
          dotnet format src/BeastCraft.Core/BeastCraft.Core.csproj
          --verify-no-changes
          --verbosity diagnostic

      - name: Compile check (dotnet build)
        run: >-
          dotnet build src/BeastCraft.Core/BeastCraft.Core.csproj
          --configuration Release

      # The presentation layer, the shared viewer and the desktop host (MonoGame
      # DesktopGL). The host's build compiles Core, Presentation and Game too; it copies the content
      # (data JSON, and the pixel-art PNGs as LFS pointers here, since checkout
      # skips LFS) but never reads it, so no art is needed to compile.
      - name: Format check (Presentation, Game, Desktop)
        run: |
          dotnet format src/BeastCraft.Presentation/BeastCraft.Presentation.csproj --verify-no-changes --verbosity diagnostic
          dotnet format src/BeastCraft.Game/BeastCraft.Game.csproj --verify-no-changes --verbosity diagnostic
          dotnet format src/BeastCraft.Desktop/BeastCraft.Desktop.csproj --verify-no-changes --verbosity diagnostic

      - name: Compile check (Desktop)
        run: >-
          dotnet build src/BeastCraft.Desktop/BeastCraft.Desktop.csproj
          --configuration Release

      # The test suite: Tooling/EditModeTests references BeastCraft.Core and
      # runs the tests with NUnit.
      - name: Format check (EditModeTests)
        run: >-
          dotnet format Tooling/EditModeTests
          --verify-no-changes
          --verbosity diagnostic

      - name: EditMode tests (dotnet test)
        run: >-
          dotnet test Tooling/EditModeTests
          --configuration Release
