# ---------------------------------------------------------------------------
# TODO: Unity Test Runner (GameCI) is intentionally NOT part of this workflow.
#
# Running the real EditMode/PlayMode suites needs a Unity Editor image and a
# `UNITY_LICENSE` repository secret, neither of which exists yet. Until that
# secret is provisioned, the automated C# validation is stub-based: the
# compile + format check of the game scripts, and the EditMode suite run with
# NUnit outside Unity by Tooling/EditModeTests (see Tooling/CiStubs/README.md
# for how both work and what they do and do not prove).
#
# When a Unity job is eventually added, it must follow this repo's CI-budget
# discipline: a Unity Editor runner is an order of magnitude more expensive in
# Actions minutes than this job. CI is a final gate, never a test loop --
# everything must be green locally first, one push per PR, and no per-commit
# fan-out. Mobile build matrices remain out of scope for this workflow.
# ---------------------------------------------------------------------------

name: CI

on:
  pull_request:
    branches: [main]
  # Deliberately NOT `push` on every branch: feature-branch commits are
  # validated when their PR opens/updates, not once per commit. This repo is
  # cost-conscious about Actions minutes.
  push:
    branches: [main]

# A superseded push to the same PR or branch cancels the run it replaced
# instead of burning minutes on a result nobody will read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Single job, no matrix: Unity Editor tests and mobile builds are out of
  # scope here. This compiles the real game scripts against the hand-written
  # UnityEngine stub in Tooling/CiStubs, which needs no Unity install, and
  # runs the EditMode suite against the same stub.
  lint-and-compile:
    name: Lint and compile (C#)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Art/audio LFS objects are irrelevant to a C# compile; skipping the
          # smudge keeps checkout fast and off the LFS bandwidth quota.
          lfs: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          # NuGet caching is intentionally disabled. CiLint and UnityStub
          # declare no PackageReference; EditModeTests does (the test SDK and
          # NUnit, three small packages restored in seconds), but no project
          # commits a packages.lock.json, which setup-dotnet's cache keys on
          # by default, and with CiLint alone `cache: true` failed the job in
          # the post step ("Cache folder path is retrieved for .NET CLI but
          # doesn't exist on disk"). Re-enable it with a lock file (or an
          # explicit cache-dependency-path) if restores ever get slow.
          cache: false

      - name: Format check (dotnet format)
        run: >-
          dotnet format Tooling/CiStubs/CiLint/CiLint.csproj
          --verify-no-changes
          --verbosity diagnostic

      - name: Compile check (dotnet build)
        run: >-
          dotnet build Tooling/CiStubs/CiLint/CiLint.csproj
          --configuration Release

      # The EditMode suite, outside Unity: Tooling/EditModeTests compiles the
      # Runtime, Editor and Tests/EditMode scripts against the UnityStub
      # sources (with a real JsonUtility over System.Text.Json) and runs them
      # with NUnit. Still no Unity install; Unity's Test Runner stays the
      # authority on real serialization.
      - name: Format check (EditModeTests)
        run: >-
          dotnet format Tooling/EditModeTests
          --verify-no-changes
          --verbosity diagnostic

      - name: EditMode tests (dotnet test)
        run: >-
          dotnet test Tooling/EditModeTests
          --configuration Release
